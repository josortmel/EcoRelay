name: CI

on:
    pull_request:
        branches: [main]
    push:
        branches: [main]

# Read-only by default; the release job asks for write access for itself only.
permissions:
    contents: read

jobs:
    check:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - uses: oven-sh/setup-bun@v2
              with:
                  # Fixed version: a new bun release must not turn CI red on its own.
                  # Bump it on purpose, in its own PR.
                  bun-version: 1.3.12

            - id: install
              run: bun install --frozen-lockfile

            # Every check runs even if an earlier one fails, so each PR shows the
            # result of all four (a red typecheck hid lint and format for 5 months).
            # They only run if the install worked: without dependencies they mean nothing.
            - name: Typecheck
              if: ${{ !cancelled() && steps.install.outcome == 'success' }}
              run: bun run typecheck

            - name: Lint
              if: ${{ !cancelled() && steps.install.outcome == 'success' }}
              run: bun run lint

            - name: Format
              if: ${{ !cancelled() && steps.install.outcome == 'success' }}
              run: bun run format:check

            # A run cut short can still exit 0: for five months a hub started by a test
            # called process.exit(0) after 10 s idle, so CI ran ~400 of 850 tests and
            # reported green. Require bun's summary and at least MIN_TESTS tests.
            # Removing tests on purpose? Lower MIN_TESTS in the same PR.
            - name: Test
              if: ${{ !cancelled() && steps.install.outcome == 'success' }}
              shell: bash
              env:
                  MIN_TESTS: 850
              run: |
                  set +e
                  bun test 2>&1 | tee test-output.txt
                  status=${PIPESTATUS[0]}
                  ran=$(grep -oE '^Ran [0-9]+ tests' test-output.txt | grep -oE '[0-9]+' | tail -1)
                  ran=${ran:-0}
                  echo "tests run: $ran (minimum $MIN_TESTS), bun exit code: $status"
                  if [ "$ran" -lt "$MIN_TESTS" ]; then
                      echo "::error::only $ran tests ran (expected at least $MIN_TESTS): the run was cut short or tests were lost"
                      exit 1
                  fi
                  exit "$status"

    # CD: when main is green and package.json states a version that has no tag yet, tag
    # that commit and publish the release, with its CHANGELOG.md section as the notes.
    # Nobody has to remember: bump the version in a PR (scripts/bump-version.ts), write
    # the CHANGELOG section (src/version.test.ts requires it), merge.
    release:
        needs: check
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        runs-on: ubuntu-latest
        permissions:
            contents: write
        steps:
            - uses: actions/checkout@v4
              with:
                  fetch-depth: 0

            - name: Release the package.json version if it has no tag yet
              shell: bash
              env:
                  GH_TOKEN: ${{ github.token }}
              run: |
                  version=$(jq -r .version package.json)
                  tag="v$version"
                  if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
                      echo "$tag is already released: nothing to do"
                      exit 0
                  fi
                  awk -v v="$version" 'index($0, "## [" v "]") == 1 {on=1; next} on && index($0, "## [") == 1 {exit} on {print}' CHANGELOG.md > notes.md
                  if ! grep -q '[^[:space:]]' notes.md; then
                      echo "::error::CHANGELOG.md has no section for [$version]"
                      exit 1
                  fi
                  gh release create "$tag" --target "$GITHUB_SHA" --title "$tag" --notes-file notes.md
                  echo "released $tag at $GITHUB_SHA"
